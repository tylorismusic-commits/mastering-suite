name: macOS

# Compile and test the plug-in on Apple Silicon.
#
# The CLAP editor is Cocoa on macOS; the LV2 UI and the CLAP host test are
# still X11-only and are skipped there (see CMakeLists.txt).  This job proves
# the DSP, parameters, presets and cairo panel compile, and that the CLAP
# bundle is self-contained.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-15
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        run: |
          brew install cmake pkg-config cairo freetype lv2 lilv dylibbundler
          pkg-config --modversion cairo lv2
          cmake --version | head -1

      - name: Configure
        run: >
          cmake -S . -B build-macos
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build-macos

      - name: Test
        run: ctest --test-dir build-macos --output-on-failure

      - name: Check the CLAP bundle
        run: |
          file build-macos/clap/MasteringSuite.clap/Contents/MacOS/MasteringSuite
          otool -L build-macos/clap/MasteringSuite.clap/Contents/MacOS/MasteringSuite | head -12
          if otool -L build-macos/clap/MasteringSuite.clap/Contents/MacOS/MasteringSuite | grep -q '@executable_path'; then
            echo "bundle still references @executable_path"; exit 1
          fi
          codesign --verify --verbose build-macos/clap/MasteringSuite.clap

      - name: Upload CLAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MasteringSuite-macos-clap
          path: build-macos/clap
          if-no-files-found: warn
